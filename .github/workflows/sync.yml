name: סנכרון מגרמין ופרסום הדשבורד

on:
  workflow_dispatch: {}
  schedule:
    # פעם ביום ב-19:07 UTC = 21:07 שעון ישראל בחורף (22:07 בשעון קיץ)
    - cron: "7 19 * * *"
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fetch/requirements.txt
      - run: pip install -r fetch/requirements.txt
      - name: שחזור טוקנים של גרמין
        uses: actions/cache/restore@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
          restore-keys: garmin-tokens-
      - name: שאיבת נתונים
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COACH_PROFILE: ${{ secrets.COACH_PROFILE }}
        run: python fetch/fetch_garmin.py
      - name: שמירת טוקנים מתחדשים
        if: always() && hashFiles('.garmin_tokens/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .garmin_tokens
          key: garmin-tokens-${{ github.run_id }}
      - name: שמירת הנתונים בריפו
        if: always()
        run: |
          git config user.name "swim-bot"
          git config user.email "swim-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "עדכון נתוני שחייה" && git pull --rebase && git push)
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: docs
      - id: deploy
        if: always()
        uses: actions/deploy-pages@v4
